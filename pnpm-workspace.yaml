packages:
  - apps/*
  - packages/**
  - docs
  - '!**/__tests__/*'

catalog:
  # Core dependencies
  '@types/node': ^22.15.32
  react: ^19.1.0
  'react-dom': ^19.1.0
  '@types/react': ^19.1.8
  '@types/react-dom': ^19.1.6
  typescript: ^5.8.3
  
  # Build tools
  next: ^15.3.4
  vite: ^6.3.5
  turbo: ^2.5.4
  
  # Styling
  tailwindcss: ^4.1.10
  '@tailwindcss/postcss': ^4.1.10
  
  # Utilities
  hono: ^4.8.2
  zod: ^3.25.67
  
  # Development
  '@biomejs/biome': ^2.0.5
  dotenv-cli: ^8.0.0
  rimraf: ^6.0.1
  vitest: ^3.2.4
  
  # Forms and UI
  'react-hook-form': ^7.58.1
  '@hookform/resolvers': ^5.1.1
  sonner: ^2.0.5
  swr: ^2.3.3
  
  # i18n
  i18next: ^25.2.1
  'react-i18next': ^15.5.3
  
  # Icons
  'react-icons': ^5.5.0
  '@iconify/react': ^6.0.0
  '@radix-ui/react-icons': ^1.3.2

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - react
    - 'react-dom'
    - typescript
